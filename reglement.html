<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="author" content="Jérémy Bizeul (SARL Prévisecours)">
<meta name="copyright" content="© 2026 Jérémy Bizeul / SARL Prévisecours. Tous droits réservés.">
<title>Règlement intérieur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --primaire: #0a5c8a; --fond: #f4f6f8; --texte: #1c2b36; --bordure: #d7dee3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--fond); color: var(--texte); }
  header { background: var(--primaire); color: #fff; padding: 14px 16px; }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }
  .carte { background: #fff; border: 1px solid var(--bordure); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .question { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  .notes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .notes button { border: 1px solid var(--bordure); background: #fff; border-radius: 8px; padding: 12px 0; font-size: 18px; font-weight: 600; cursor: pointer; color: var(--texte); }
  .notes button.choisi { background: var(--primaire); color: #fff; border-color: var(--primaire); }
  .legende { display: flex; justify-content: space-between; font-size: 11px; color: #55636c; margin-top: 4px; }
  textarea, select { font: inherit; width: 100%; padding: 10px; border: 1px solid var(--bordure); border-radius: 8px; }
  button.principal { width: 100%; background: var(--primaire); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button.principal:disabled { opacity: .5; }
  .erreur { color: #b3261e; font-size: 14px; margin-top: 10px; }
  .info { font-size: 14px; color: #55636c; }
  .grand { font-size: 17px; text-align: center; padding: 20px 8px; }
  .option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--bordure); border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 15px; }
  .option input { margin-top: 3px; flex: none; width: 18px; height: 18px; }
  .option.choisi { border-color: var(--primaire); background: #eef6fb; }
  .recap { width: 100%; border-collapse: collapse; font-size: 15px; }
  .recap td { padding: 6px 0; vertical-align: top; }
  .recap td:first-child { color: #55636c; width: 42%; padding-right: 10px; }
  .indice { font-size: 12px; color: #55636c; font-weight: normal; }
  .reglement { white-space: pre-wrap; font-size: 14px; line-height: 1.5; max-height: 55vh; overflow-y: auto; border: 1px solid var(--bordure); border-radius: 8px; padding: 12px; background: #fcfcfd; }
</style>
</head>
<body>
<header>
  <h1 id="titre">Règlement intérieur</h1>
  <p id="sous-titre"></p>
</header>
<main id="contenu"><p class="info">Chargement…</p></main>

<script>
// © 2026 Jérémy Bizeul / SARL Prévisecours — Tous droits réservés.
// Page publique du règlement intérieur (QR code personnel de la convocation) : lecture + preuve horodatée de prise de connaissance.
const SUPABASE_URL = 'https://kzahahrnauynnrfznkje.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VpOYj7KajWRHJKyjPyLh_g_mgabFpgZ';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = new URLSearchParams(location.search).get('t');
function dateFr(iso) { return iso ? new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR') : ''; }
function message(txt) { $('#contenu').innerHTML = `<div class="carte grand">${esc(txt)}</div>`; }
async function chargerParcours() {
  if (!token || !/^[0-9a-f-]{36}$/i.test(token)) { message('Lien invalide. Scannez à nouveau le QR code de votre convocation.'); return null; }
  const { data, error } = await supa.rpc('parcours_charger', { p_token: token });
  if (error || !data) { message('Impossible de charger la page. Vérifiez votre connexion et réessayez.'); return null; }
  if (!data.ok) { message(data.message || 'Lien invalide.'); return null; }
  return data;
}
function recapHtml(d) {
  const plage = dateFr(d.date_debut) + (d.date_fin && d.date_fin !== d.date_debut ? ' au ' + dateFr(d.date_fin) : '');
  return `<table class="recap">
    <tr><td>Nom &amp; Prénom</td><td><strong>${esc(d.prenom)} ${esc(String(d.nom || '').toUpperCase())}</strong></td></tr>
    ${d.entreprise ? `<tr><td>Entreprise</td><td>${esc(d.entreprise)}</td></tr>` : ''}
    <tr><td>Date de la formation</td><td>${esc(plage)}</td></tr>
    ${d.type_formation ? `<tr><td>Type de formation</td><td>${d.type_formation === 'recyclage' ? 'Recyclage' : 'Initiale'}</td></tr>` : ''}
    <tr><td>Formation</td><td>${esc(d.formation)}</td></tr>
  </table>`;
}

async function demarrer() {
  const d = await chargerParcours();
  if (!d) return;
  $('#sous-titre').textContent = d.organisme || '';
  const r = d.reglement;
  if (!r.disponible) { message('Le règlement intérieur n\'est pas encore disponible. Demandez-le à votre formateur.'); return; }
  const dejaAccepte = !!r.accepte_le;
  $('#contenu').innerHTML = `
    <div class="carte">
      <p class="question" style="font-size:17px;">Bonjour ${esc(d.prenom)} !</p>
      ${recapHtml(d)}
    </div>
    <div class="carte">
      <p class="question">Règlement intérieur</p>
      <div class="reglement">${esc(r.texte)}</div>
    </div>
    ${dejaAccepte ? `<div class="carte grand">Vous avez déjà pris connaissance du règlement intérieur le ${new Date(r.accepte_le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' })}. Merci !</div>`
      : !r.ouvert ? '<div class="carte grand">Cette session est terminée ou annulée.</div>'
      : `<div class="carte">
          <label class="option"><input type="checkbox" id="accord"><span>J'ai lu le règlement intérieur et je m'engage à le respecter pendant la formation.</span></label>
          <button class="principal" id="valider" disabled>Je confirme</button>
          <div class="erreur" id="erreur"></div>
        </div>`}`;
  if ($('#accord')) {
    $('#accord').onchange = e => { $('#valider').disabled = !e.target.checked; e.target.closest('.option').classList.toggle('choisi', e.target.checked); };
    $('#valider').onclick = async () => {
      $('#valider').disabled = true;
      const { error } = await supa.rpc('reglement_accepter', { p_token: token });
      if (error) { $('#erreur').textContent = error.message || 'Erreur lors de l\'envoi.'; $('#valider').disabled = false; return; }
      message('Merci, votre prise de connaissance du règlement intérieur est enregistrée.');
    };
  }
}
demarrer();
</script>
<footer style="text-align:center;font-size:11px;color:#464645;opacity:.7;padding:0 16px 24px;">© 2026 Jérémy Bizeul / SARL Prévisecours</footer>
</body>
</html>
