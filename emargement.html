<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="author" content="Jérémy Bizeul (SARL Prévisecours)">
<meta name="copyright" content="© 2026 Jérémy Bizeul / SARL Prévisecours. Tous droits réservés.">
<title>Émargement</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --primaire: #0a5c8a; --fond: #f4f6f8; --texte: #1c2b36; --bordure: #d7dee3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--fond); color: var(--texte); }
  header { background: var(--primaire); color: #fff; padding: 14px 16px; }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }
  .carte { background: #fff; border: 1px solid var(--bordure); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .grand { font-size: 17px; text-align: center; padding: 20px 8px; }
  .info { font-size: 14px; color: #55636c; }
  select { font: inherit; width: 100%; padding: 10px; border: 1px solid var(--bordure); border-radius: 8px; }
  .creneau { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #eee; font-size: 15px; }
  .creneau:first-of-type { border-top: none; }
  .creneau.courant { background: #eaf3f9; margin: 0 -8px; padding: 10px 8px; border-radius: 8px; }
  .ok { color: #1a7f3c; font-weight: 600; }
  button.principal { background: var(--primaire); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.secondaire { background: #eee; color: #333; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  #voile { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; }
  #voile.actif { display: flex; }
  #feuille { background: #fff; width: 100%; max-width: 560px; border-radius: 14px 14px 0 0; padding: 16px; }
  canvas { width: 100%; height: 200px; border: 2px dashed #9aa5ab; border-radius: 8px; touch-action: none; background: #fff; display: block; }
  .erreur { color: #b3261e; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="titre">Émargement</h1>
  <p id="sous-titre"></p>
</header>
<main id="contenu"><p class="info">Chargement…</p></main>

<div id="voile">
  <div id="feuille">
    <p id="signer-titre" style="margin:0 0 8px;font-weight:600;"></p>
    <canvas id="zone-signature"></canvas>
    <p class="info" style="margin:6px 0 10px;">Signez avec le doigt dans le cadre.</p>
    <div style="display:flex;gap:8px;">
      <button class="secondaire" id="effacer">Effacer</button>
      <button class="secondaire" id="annuler">Annuler</button>
      <button class="principal" id="valider" style="flex:1;">Valider</button>
    </div>
    <div class="erreur" id="erreur"></div>
  </div>
</div>

<script>
// © 2026 Jérémy Bizeul / SARL Prévisecours — Tous droits réservés.
// Page publique d'émargement par QR code. Même origine que l'application :
// si le formateur y est connecté, il peut signer pour lui-même (RPC
// emargement_formateur), sinon il s'agit d'un stagiaire (RPC emargement_enregistrer).
const SUPABASE_URL = 'https://kzahahrnauynnrfznkje.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VpOYj7KajWRHJKyjPyLh_g_mgabFpgZ';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = new URLSearchParams(location.search).get('t');
const DJ = { matin: 'Matin', apres_midi: 'Après-midi' };
let donnees = null, qui = null, creneauEnCours = null;

function dateFr(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function message(txt) { $('#contenu').innerHTML = `<div class="carte grand">${esc(txt)}</div>`; }
function jours(debut, fin, aujourdhui) {
  const liste = [];
  for (let d = new Date(debut + 'T12:00:00'); liste.length < 31; d.setDate(d.getDate() + 1)) {
    const iso = d.toISOString().slice(0, 10);
    if (iso > fin || iso > aujourdhui) break;
    liste.push(iso);
  }
  return liste;
}

async function charger() {
  const { data, error } = await supa.rpc('emargement_charger', { p_token: token });
  if (error || !data) { message('Impossible de charger la page. Vérifiez votre connexion et réessayez.'); return; }
  if (!data.ok) { message(data.message || 'Lien invalide.'); return; }
  donnees = data;
  $('#titre').textContent = data.formation || 'Émargement';
  $('#sous-titre').textContent = (data.organisme || '') + ' — ' + dateFr(data.date_debut) + (data.date_fin !== data.date_debut ? ' au ' + dateFr(data.date_fin) : '');
  if (!data.ouvert) { message(data.message || 'L\'émargement n\'est pas ouvert.'); return; }
  afficher();
}

function afficher() {
  const d = donnees;
  const options = (d.participants || []).map(p => `<option value="${esc(p.id)}" ${qui === p.id ? 'selected' : ''}>${esc(p.nom)}</option>`).join('');
  $('#contenu').innerHTML = `
    <div class="carte">
      <p style="margin:0 0 8px;font-weight:600;">Qui êtes-vous ?</p>
      <select id="qui">
        <option value="">— Choisissez votre nom —</option>
        ${d.est_formateur ? '<option value="formateur" ' + (qui === 'formateur' ? 'selected' : '') + '>Je suis le formateur (connecté)</option>' : ''}
        ${options}
      </select>
      <p class="info" style="margin-bottom:0;">Votre nom n'apparaît pas ? Prévenez votre formateur.</p>
    </div>
    <div id="creneaux"></div>`;
  $('#qui').onchange = e => { qui = e.target.value || null; afficherCreneaux(); };
  afficherCreneaux();
}

function afficherCreneaux() {
  const zone = $('#creneaux');
  if (!qui) { zone.innerHTML = ''; return; }
  const d = donnees;
  const signes = qui === 'formateur' ? d.formateur_signes : (d.participants.find(p => p.id === qui)?.signes || []);
  const estSigne = (jour, dj) => signes.some(s => s.jour === jour && s.dj === dj);
  const maintenant = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
  const djCourant = (maintenant.getHours() * 60 + maintenant.getMinutes()) < 12 * 60 + 30 ? 'matin' : 'apres_midi';

  zone.innerHTML = `<div class="carte">
    <p style="margin:0 0 6px;font-weight:600;">Vos signatures</p>
    ${jours(d.date_debut, d.date_fin, d.aujourdhui).flatMap(j => ['matin', 'apres_midi'].map(dj => {
      const courant = j === d.aujourdhui && dj === djCourant;
      return `<div class="creneau ${courant ? 'courant' : ''}">
        <span>${esc(dateFr(j))} — ${DJ[dj]}</span>
        ${estSigne(j, dj) ? '<span class="ok">✓ Signé</span>' : `<button class="principal" data-j="${j}" data-dj="${dj}">Signer</button>`}
      </div>`;
    })).join('')}
  </div>`;
  zone.querySelectorAll('button[data-j]').forEach(b => { b.onclick = () => ouvrirSignature(b.dataset.j, b.dataset.dj); });
}

// ---- Zone de signature (canvas tactile) ----
const canvas = $('#zone-signature');
let ctx = null, trace = false, aSigne = false;
function preparerCanvas() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * 2); canvas.height = Math.round(r.height * 2);
  ctx = canvas.getContext('2d');
  ctx.scale(2, 2); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
  aSigne = false;
}
function pos(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); trace = true; aSigne = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); ctx.stroke(); });
canvas.addEventListener('pointermove', e => { if (!trace) return; e.preventDefault(); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, () => { trace = false; }));

function ouvrirSignature(jour, dj) {
  creneauEnCours = { jour, dj };
  $('#signer-titre').textContent = `${dateFr(jour)} — ${DJ[dj]}`;
  $('#erreur').textContent = '';
  $('#voile').classList.add('actif');
  preparerCanvas();
}
$('#effacer').onclick = preparerCanvas;
$('#annuler').onclick = () => $('#voile').classList.remove('actif');

// Image réduite (300 × 120, fond blanc) pour rester légère en base et dans le PDF.
function signatureEnPng() {
  const sortie = document.createElement('canvas');
  sortie.width = 300; sortie.height = 120;
  const c = sortie.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, 300, 120);
  c.drawImage(canvas, 0, 0, 300, 120);
  return sortie.toDataURL('image/png');
}

$('#valider').onclick = async () => {
  if (!aSigne) { $('#erreur').textContent = 'Merci de signer dans le cadre.'; return; }
  $('#valider').disabled = true;
  const png = signatureEnPng();
  const { jour, dj } = creneauEnCours;
  const { error } = qui === 'formateur'
    ? await supa.rpc('emargement_formateur', { p_token: token, p_jour: jour, p_demi_journee: dj, p_signature: png })
    : await supa.rpc('emargement_enregistrer', { p_token: token, p_participant: qui, p_jour: jour, p_demi_journee: dj, p_signature: png });
  $('#valider').disabled = false;
  if (error) { $('#erreur').textContent = error.message || 'Erreur lors de l\'envoi.'; return; }
  (qui === 'formateur' ? donnees.formateur_signes : donnees.participants.find(p => p.id === qui).signes).push({ jour, dj });
  $('#voile').classList.remove('actif');
  afficherCreneaux();
};

charger();
</script>
<footer style="text-align:center;font-size:11px;color:#464645;opacity:.7;padding:0 16px 24px;">© 2026 Jérémy Bizeul / SARL Prévisecours</footer>
</body>
</html>
