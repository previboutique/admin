<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Jérémy Bizeul (SARL Prévisecours)">
<meta name="copyright" content="© 2026 Jérémy Bizeul / SARL Prévisecours. Tous droits réservés.">
<title>Espace client</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root { --primaire: #0a5c8a; --fond: #f4f6f8; --texte: #1c2b36; --bordure: #d7dee3; --gris: #55636c; --vert: #1a7f3c; --rouge: #b3261e; --orange: #8a5a00; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--fond); color: var(--texte); }
  header { background: var(--primaire); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
  header button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 60px; }
  .carte { background: #fff; border: 1px solid var(--bordure); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .carte h2, .carte h3 { margin: 0 0 8px; }
  .info { font-size: 13px; color: var(--gris); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input, select { font: inherit; width: 100%; padding: 9px 10px; border: 1px solid var(--bordure); border-radius: 8px; background: #fff; }
  input[type=checkbox] { width: auto; }
  .ligne { display: flex; gap: 10px; flex-wrap: wrap; }
  .ligne > div { flex: 1; min-width: 150px; }
  button.principal { background: var(--primaire); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.secondaire { background: #eee; color: #333; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button.petit { padding: 6px 12px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .erreur { color: var(--rouge); font-size: 14px; margin-top: 8px; }
  .ok { color: var(--vert); font-weight: 600; }
  .pastille { display: inline-block; font-size: 12px; border-radius: 10px; padding: 1px 9px; white-space: nowrap; }
  .p-vert { background: #e6f4ea; color: var(--vert); } .p-orange { background: #fff4d6; color: var(--orange); } .p-rouge { background: #fdeeee; color: var(--rouge); } .p-gris { background: #eceff1; color: var(--gris); }
  .session { cursor: pointer; } .session:hover { border-color: var(--primaire); }
  .doc { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid #eee; flex-wrap: wrap; }
  .doc:first-of-type { border-top: none; }
  .stagiaire { border: 1px solid var(--bordure); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fafbfc; }
  #voile { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 12px; overflow: auto; }
  #voile.actif { display: flex; }
  #feuille { background: #fff; width: 100%; max-width: 560px; border-radius: 14px; padding: 16px; }
  canvas { width: 100%; height: 180px; border: 2px dashed #9aa5ab; border-radius: 8px; touch-action: none; background: #fff; display: block; }
  a.lien { color: var(--primaire); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header id="entete" style="display:none;">
  <div><h1 id="titre">Espace client</h1><p id="sous-titre"></p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button id="btn-mdp">Changer mon mot de passe</button>
    <button id="btn-quitter">Se déconnecter</button>
  </div>
</header>
<main id="contenu"><p class="info">Chargement…</p></main>

<div id="voile"><div id="feuille"></div></div>

<script src="espace-client.js"></script>
<footer style="text-align:center;font-size:11px;color:#464645;opacity:.7;padding:0 16px 24px;">© 2026 Jérémy Bizeul / SARL Prévisecours</footer>
</body>
</html>
